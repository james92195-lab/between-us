# Render Blueprint for Between Us.
# Apply from the dashboard. This file does not create the service by itself.
# Free Postgres expires — see docs/deploy-render.md.

databases:
  - name: between-us-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: between_us
    user: between_us

services:
  - type: web
    name: between-us
    runtime: node
    plan: free
    region: oregon
    healthCheckPath: /healthz
    buildCommand: npm ci && npm run build:render
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: between-us-db
          property: connectionString
      - key: VITE_AUTH_ENABLED
        value: "true"
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        fromService:
          name: between-us
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Present and blank. Transfers stay disabled. Do not fill these in.
      - key: DWOLLA_ENVIRONMENT
        value: ""
      - key: DWOLLA_CLIENT_ID
        value: ""
      - key: DWOLLA_CLIENT_SECRET
        value: ""
      - key: DWOLLA_WEBHOOK_SECRET
        value: ""
      - key: DWOLLA_PLAID_EXCHANGE_PARTNER_HREF
        value: ""
      - key: DWOLLA_P2P_APPROVAL
        value: ""
      - key: DWOLLA_LAUNCH_COUNTRY
        value: ""
      - key: DWOLLA_SANDBOX_DISPATCH
        value: ""
